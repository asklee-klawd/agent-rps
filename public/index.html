<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent RPS - Rock Paper Scissors Betting</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 {
      color: white;
      text-align: center;
      margin-bottom: 30px;
      font-size: 2.5rem;
    }
    h2 {
      color: #667eea;
      margin-bottom: 16px;
    }
    .game-actions {
      display: grid;
      gap: 12px;
    }
    .move-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 16px 0;
    }
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      background: #5568d3;
      transform: translateY(-2px);
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    .move-btn {
      font-size: 32px;
      padding: 20px;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 12px;
    }
    .game-list {
      display: grid;
      gap: 8px;
    }
    .game-item {
      background: #f7fafc;
      padding: 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
    }
    .leaderboard-table th,
    .leaderboard-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }
    .leaderboard-table th {
      background: #f7fafc;
      font-weight: 600;
    }
    .result {
      padding: 16px;
      border-radius: 8px;
      margin: 16px 0;
    }
    .result.win {
      background: #c6f6d5;
      border: 2px solid #48bb78;
    }
    .result.lose {
      background: #fed7d7;
      border: 2px solid #f56565;
    }
    .result.draw {
      background: #feebc8;
      border: 2px solid #ed8936;
    }
    .did-display {
      font-family: monospace;
      font-size: 12px;
      color: #718096;
      word-break: break-all;
    }
    .status {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      display: inline-block;
      margin: 8px 0;
    }
    .status.success {
      background: #c6f6d5;
      color: #22543d;
    }
    .status.error {
      background: #fed7d7;
      color: #742a2a;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 Agent RPS</h1>

    <div class="card">
      <h2>Your Agent</h2>
      <div id="agent-info">
        <button onclick="createAgent()">Generate Agent Identity</button>
      </div>
    </div>

    <div class="card">
      <h2>Create Game</h2>
      <div class="game-actions">
        <input type="number" id="bet-amount" placeholder="Bet amount" value="10" min="1">
        <div class="move-buttons">
          <button class="move-btn" onclick="createGame('rock')">🪨 Rock</button>
          <button class="move-btn" onclick="createGame('paper')">📄 Paper</button>
          <button class="move-btn" onclick="createGame('scissors')">✂️ Scissors</button>
        </div>
      </div>
      <div id="create-result"></div>
    </div>

    <div class="card">
      <h2>Active Games</h2>
      <div id="active-games"></div>
    </div>

    <div class="card">
      <h2>Leaderboard</h2>
      <div id="leaderboard"></div>
    </div>
  </div>

  <script type="module">
    let agentIdentity = null;
    let agentToken = null;

    window.createAgent = async function() {
      const { AgentIdentity, AATToken, createDelegation } = await import('/@agentauth/core');
      
      // Create identity
      agentIdentity = await AgentIdentity.create({
        metadata: { name: 'RPS Player' }
      });

      // Create delegation
      const delegation = createDelegation({
        delegatorDID: 'did:web:agent-rps.example.com',
        delegateDID: agentIdentity.did,
        scopes: ['game.play', 'game.bet'],
        constraints: { maxUsesPerHour: 100 }
      });

      // Create token
      agentToken = await AATToken.create({
        identity: agentIdentity,
        delegator: 'did:web:agent-rps.example.com',
        audience: 'https://agent-rps.example.com',
        scopes: ['game.play'],
        delegationChain: [delegation],
        expiresIn: '24h'
      });

      document.getElementById('agent-info').innerHTML = `
        <div class="status success">Agent Created!</div>
        <div class="did-display">DID: ${agentIdentity.did}</div>
      `;
    };

    window.createGame = async function(move) {
      if (!agentToken) {
        alert('Create an agent first!');
        return;
      }

      const bet = parseFloat(document.getElementById('bet-amount').value);
      
      const response = await fetch('/api/game/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: agentToken, bet, move })
      });

      const result = await response.json();
      
      if (response.ok) {
        document.getElementById('create-result').innerHTML = `
          <div class="status success">
            Game #${result.gameId} created! Waiting for opponent...
          </div>
        `;
        loadActiveGames();
      } else {
        document.getElementById('create-result').innerHTML = `
          <div class="status error">Error: ${result.error}</div>
        `;
      }
    };

    window.joinGame = async function(gameId) {
      if (!agentToken) {
        alert('Create an agent first!');
        return;
      }

      const move = prompt('Choose your move (rock/paper/scissors):');
      if (!['rock', 'paper', 'scissors'].includes(move)) {
        alert('Invalid move!');
        return;
      }

      const response = await fetch(`/api/game/${gameId}/join`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: agentToken, move })
      });

      const result = await response.json();
      
      if (response.ok) {
        const resultClass = result.winner === agentIdentity.did ? 'win' : 
                           result.winner ? 'lose' : 'draw';
        
        alert(`
Game Complete!
Your move: ${result.player2.move}
Opponent: ${result.player1.move}
Result: ${result.result}
Pot: $${result.pot}
        `);
        
        loadActiveGames();
        loadLeaderboard();
      } else {
        alert(`Error: ${result.error}`);
      }
    };

    async function loadActiveGames() {
      const response = await fetch('/api/games/active');
      const data = await response.json();

      const html = data.games.length > 0 
        ? data.games.map(g => `
            <div class="game-item">
              <span>Game #${g.id} - Bet: $${g.bet}</span>
              <button onclick="joinGame(${g.id})">Join</button>
            </div>
          `).join('')
        : '<p style="color: #718096">No active games. Create one!</p>';

      document.getElementById('active-games').innerHTML = html;
    }

    async function loadLeaderboard() {
      const response = await fetch('/api/leaderboard');
      const data = await response.json();

      const html = `
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th>Agent</th>
              <th>W</th>
              <th>L</th>
              <th>D</th>
              <th>Net</th>
            </tr>
          </thead>
          <tbody>
            ${data.leaderboard.map(l => `
              <tr>
                <td class="did-display">${l.did.substring(0, 30)}...</td>
                <td>${l.wins}</td>
                <td>${l.losses}</td>
                <td>${l.draws}</td>
                <td style="color: ${l.net >= 0 ? '#48bb78' : '#f56565'}">
                  $${l.net.toFixed(2)}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;

      document.getElementById('leaderboard').innerHTML = html;
    }

    // Load on start
    loadActiveGames();
    loadLeaderboard();

    // Refresh every 5 seconds
    setInterval(() => {
      loadActiveGames();
      loadLeaderboard();
    }, 5000);
  </script>
</body>
</html>
