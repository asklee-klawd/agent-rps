<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent RPS - Provably Fair Rock Paper Scissors</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    h1 {
      color: white;
      text-align: center;
      margin-bottom: 30px;
      font-size: 2.5rem;
    }
    h2 {
      color: #667eea;
      margin-bottom: 16px;
    }
    .subtitle {
      color: white;
      text-align: center;
      margin-top: -20px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      opacity: 0.9;
    }
    .game-actions {
      display: grid;
      gap: 12px;
    }
    .move-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 16px 0;
    }
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      background: #5568d3;
      transform: translateY(-2px);
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    .move-btn {
      font-size: 32px;
      padding: 20px;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 16px;
      margin-bottom: 12px;
    }
    .game-list {
      display: grid;
      gap: 8px;
    }
    .game-item {
      background: #f7fafc;
      padding: 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
    }
    .leaderboard-table th,
    .leaderboard-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }
    .leaderboard-table th {
      background: #f7fafc;
      font-weight: 600;
    }
    .result {
      padding: 16px;
      border-radius: 8px;
      margin: 16px 0;
    }
    .result.win {
      background: #c6f6d5;
      border: 2px solid #48bb78;
    }
    .result.lose {
      background: #fed7d7;
      border: 2px solid #f56565;
    }
    .result.draw {
      background: #feebc8;
      border: 2px solid #ed8936;
    }
    .did-display {
      font-family: monospace;
      font-size: 12px;
      color: #718096;
      word-break: break-all;
    }
    .status {
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      display: inline-block;
      margin: 8px 0;
    }
    .status.success {
      background: #c6f6d5;
      color: #22543d;
    }
    .status.error {
      background: #fed7d7;
      color: #742a2a;
    }
    .status.info {
      background: #bee3f8;
      color: #2c5282;
    }
    .proof-box {
      background: #f7fafc;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      font-family: monospace;
      font-size: 11px;
      color: #2d3748;
    }
    .proof-box strong {
      color: #48bb78;
    }
    .reveal-section {
      background: #fef5e7;
      border: 2px solid #f39c12;
      padding: 16px;
      border-radius: 8px;
      margin: 16px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎮 Agent RPS</h1>
    <p class="subtitle">🔒 Provably fair with commit-reveal protocol</p>

    <div class="card">
      <h2>Your Agent</h2>
      <div id="agent-info">
        <button onclick="createAgent()">Generate Agent Identity</button>
      </div>
    </div>

    <div class="card">
      <h2>Create Game</h2>
      <div class="game-actions">
        <input type="number" id="bet-amount" placeholder="Bet amount" value="10" min="1">
        <div class="move-buttons">
          <button class="move-btn" onclick="createGame('rock')">🪨 Rock</button>
          <button class="move-btn" onclick="createGame('paper')">📄 Paper</button>
          <button class="move-btn" onclick="createGame('scissors')">✂️ Scissors</button>
        </div>
      </div>
      <div id="create-result"></div>
    </div>

    <div class="card">
      <h2>Active Games</h2>
      <div id="active-games"></div>
    </div>

    <div class="card">
      <h2>Leaderboard</h2>
      <div id="leaderboard"></div>
    </div>
  </div>

  <script type="module">
    let agentIdentity = null;
    let agentToken = null;
    let pendingReveal = null; // { gameId, move, salt }

    // Crypto utils
    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function generateSalt() {
      return Array.from(crypto.getRandomValues(new Uint8Array(32)))
        .map(b => b.toString(16).padStart(2, '0'))
        .join('');
    }

    async function createCommitment(move, salt) {
      return await sha256(`${move}:${salt}`);
    }

    window.createAgent = async function() {
      const { AgentIdentity, AATToken, createDelegation } = await import('/@agentauth/core');
      
      // Create identity
      agentIdentity = await AgentIdentity.create({
        metadata: { name: 'RPS Player' }
      });

      // Create delegation
      const delegation = createDelegation({
        delegatorDID: 'did:web:agent-rps.example.com',
        delegateDID: agentIdentity.did,
        scopes: ['game.play', 'game.bet'],
        constraints: { maxUsesPerHour: 100 }
      });

      // Create token
      agentToken = await AATToken.create({
        identity: agentIdentity,
        delegator: 'did:web:agent-rps.example.com',
        audience: 'https://agent-rps.example.com',
        scopes: ['game.play'],
        delegationChain: [delegation],
        expiresIn: '24h'
      });

      document.getElementById('agent-info').innerHTML = `
        <div class="status success">Agent Created!</div>
        <div class="did-display">DID: ${agentIdentity.did}</div>
      `;
    };

    window.createGame = async function(move) {
      if (!agentToken) {
        alert('Create an agent first!');
        return;
      }

      const bet = parseFloat(document.getElementById('bet-amount').value);
      const salt = generateSalt();
      const commitment = await createCommitment(move, salt);

      const response = await fetch('/api/game/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: agentToken, bet, commitment })
      });

      const result = await response.json();
      
      if (response.ok) {
        // Store for reveal phase
        pendingReveal = { gameId: result.gameId, move, salt };
        
        document.getElementById('create-result').innerHTML = `
          <div class="status success">
            Game #${result.gameId} created! Waiting for opponent...
          </div>
          <div class="proof-box">
            <strong>Your commitment:</strong><br>
            ${commitment}<br><br>
            <em>Keep this window open to reveal after opponent joins!</em>
          </div>
        `;
        loadActiveGames();
      } else {
        document.getElementById('create-result').innerHTML = `
          <div class="status error">Error: ${result.error}</div>
        `;
      }
    };

    window.joinGame = async function(gameId) {
      if (!agentToken) {
        alert('Create an agent first!');
        return;
      }

      const move = prompt('Choose your move (rock/paper/scissors):');
      if (!['rock', 'paper', 'scissors'].includes(move)) {
        alert('Invalid move!');
        return;
      }

      const salt = generateSalt();
      const commitment = await createCommitment(move, salt);

      const response = await fetch(`/api/game/${gameId}/join`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: agentToken, commitment })
      });

      const result = await response.json();
      
      if (response.ok) {
        // Store for reveal
        pendingReveal = { gameId, move, salt };
        
        alert(`Committed to game #${gameId}! Now reveal your move.`);
        
        // Auto-reveal
        setTimeout(() => revealMove(gameId, move, salt), 1000);
        
        loadActiveGames();
      } else {
        alert(`Error: ${result.error}`);
      }
    };

    async function revealMove(gameId, move, salt) {
      if (!agentToken) return;

      const response = await fetch(`/api/game/${gameId}/reveal`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: agentToken, move, salt })
      });

      const result = await response.json();
      
      if (result.status === 'completed') {
        const resultClass = result.winner === agentIdentity.did ? 'win' : 
                           result.winner ? 'lose' : 'draw';
        
        const proofHTML = `
          <div class="proof-box">
            <strong>🔒 Cryptographic Proof:</strong><br>
            <strong>Player 1:</strong><br>
            Move: ${result.player1.move} | Salt: ${result.player1.salt.substring(0, 16)}...<br>
            Commitment: ${result.player1.commitment}<br>
            Verified Hash: ${result.proof.player1Hash}<br><br>
            
            <strong>Player 2:</strong><br>
            Move: ${result.player2.move} | Salt: ${result.player2.salt.substring(0, 16)}...<br>
            Commitment: ${result.player2.commitment}<br>
            Verified Hash: ${result.proof.player2Hash}<br><br>
            
            <strong style="color: #48bb78;">✓ Both commitments verified - no cheating possible!</strong>
          </div>
        `;
        
        document.getElementById('create-result').innerHTML = `
          <div class="result ${resultClass}">
            <h3>Game #${result.gameId} Complete!</h3>
            <p>Your move: ${move}</p>
            <p>Opponent: ${result.player1.did === agentIdentity.did ? result.player2.move : result.player1.move}</p>
            <p><strong>${result.result}</strong></p>
            <p>Pot: $${result.pot}</p>
          </div>
          ${proofHTML}
        `;
        
        pendingReveal = null;
        loadLeaderboard();
      } else {
        document.getElementById('create-result').innerHTML = `
          <div class="status info">${result.message}</div>
        `;
      }
    }

    // Auto-reveal if we have pending reveal
    setInterval(async () => {
      if (pendingReveal) {
        const { gameId, move, salt } = pendingReveal;
        
        // Check game status
        const response = await fetch(`/api/game/${gameId}/status`);
        const status = await response.json();
        
        if (status.status === 'committed') {
          // Try to reveal
          await revealMove(gameId, move, salt);
        }
      }
    }, 2000);

    async function loadActiveGames() {
      const response = await fetch('/api/games/active');
      const data = await response.json();

      const html = data.games.length > 0 
        ? data.games.map(g => `
            <div class="game-item">
              <span>Game #${g.id} - Bet: $${g.bet}</span>
              <button onclick="joinGame(${g.id})">Join</button>
            </div>
          `).join('')
        : '<p style="color: #718096">No active games. Create one!</p>';

      document.getElementById('active-games').innerHTML = html;
    }

    async function loadLeaderboard() {
      const response = await fetch('/api/leaderboard');
      const data = await response.json();

      const html = `
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th>Agent</th>
              <th>W</th>
              <th>L</th>
              <th>D</th>
              <th>Net</th>
            </tr>
          </thead>
          <tbody>
            ${data.leaderboard.map(l => `
              <tr>
                <td class="did-display">${l.did.substring(0, 30)}...</td>
                <td>${l.wins}</td>
                <td>${l.losses}</td>
                <td>${l.draws}</td>
                <td style="color: ${l.net >= 0 ? '#48bb78' : '#f56565'}">
                  $${l.net.toFixed(2)}
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;

      document.getElementById('leaderboard').innerHTML = html;
    }

    // Load on start
    loadActiveGames();
    loadLeaderboard();

    // Refresh every 5 seconds
    setInterval(() => {
      loadActiveGames();
      loadLeaderboard();
    }, 5000);
  </script>
</body>
</html>
